<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ReconX - Brand Threat Intel</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #0f1117; color: #fff; padding: 40px; }
    h1 { color: #00ffe1; }
    form input[type="text"] { width: 300px; padding: 10px; }
    form button { padding: 10px 20px; margin-left: 10px; background-color: #00ffe1; border: none; cursor: pointer; }
    .result-box { margin-top: 30px; }
    .result-item { background: #1c1e24; padding: 15px; margin-bottom: 10px; border-left: 5px solid #00ffe1; }
    a { color: #00ffe1; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔍 ReconX Brand Leak Scanner</h1>
  <form method="POST">
    <input type="text" name="brand" placeholder="Enter brand name..." required />
    <button type="submit">Scan</button>
  </form>

  {% if brand %}
    <div class="result-box">
      <h2>Results for: {{ brand }}</h2>
      {% if results %}
        {% for item in results %}
          <div class="result-item">
            <strong>{{ item.repo }}</strong><br/>
            File: {{ item.path }}<br/>
            <a href="{{ item.url }}" target="_blank">View Leak</a>
          </div>
        {% endfor %}
      {% else %}
        <p>No leaks found on GitHub.</p>
      {% endif %}
    </div>
  {% endif %}
</body>
</html>
